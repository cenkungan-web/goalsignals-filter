
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoalSignals Analiz Paneli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#0e1621;
  --card:#17212b;
  --border:#242f3d;
  --accent:#5288c1;
  --text:#f5f5f5;
  --muted:#7f91a4;
  --btn:#2ea6ff;
}
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,Arial,sans-serif;
}
body {
  background:var(--bg);
  color:var(--text);
  padding:10px;
}
.brand {
  text-align:center;
  color:#00c985;
  font-size:14px;
  font-weight:bold;
  padding:8px 0 14px;
}
.tabs,.timing {
  display:flex;
  gap:6px;
  margin-bottom:9px;
}
.tab,.time {
  flex:1;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 4px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.tab.active {
  background:var(--accent);
  color:white;
}
.time.active {
  background:#233b54;
  color:#64b5f6;
  border-color:#5288c1;
}
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-bottom:9px;
}
.card-title {
  color:var(--muted);
  font-size:11px;
  font-weight:bold;
  margin-bottom:9px;
}
.grid3 {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}
.grid2 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.field {
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.field label {
  font-size:11px;
  color:var(--muted);
}
.pair {
  display:flex;
  gap:4px;
  min-width:0;
}
.op {
  width:46px;
  flex-shrink:0;
  background:#1c2733;
  color:#64b5f6;
  border:1px solid var(--border);
  border-radius:5px;
  padding:8px 2px;
}
.val {
  width:100%;
  min-width:0;
  flex:1;
  background:#0e1621;
  color:white;
  border:1px solid var(--border);
  border-radius:5px;
  padding:9px 6px;
  font-size:12px;
}
.submit {
  width:100%;
  background:var(--btn);
  color:white;
  border:0;
  border-radius:9px;
  padding:15px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.submit:disabled {
  background:#475569;
}
#status {
  display:none;
  text-align:center;
  margin:12px 0;
  font-size:12px;
  line-height:1.6;
}
.footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin:18px 0;
}
</style>
</head>

<body>

<div class="brand">⚡ GOALSIGNALS.COM.TR ANALİZ</div>

<div class="tabs">
  <button class="tab active" id="tabBet"
    onclick="setBookmaker('Bet365')">
    🟢 Bet365 Oranları
  </button>
  <button class="tab" id="tabSb"
    onclick="setBookmaker('Sbobet')">
    🔵 Sbobet Skor Oranları
  </button>
</div>

<div id="betForm">

  <div class="timing">
    <button class="time active" id="openBtn"
      onclick="setTiming('open')">
      Açılış Oranları
    </button>
    <button class="time" id="closeBtn"
      onclick="setTiming('close')">
      Kapanış Oranları
    </button>
  </div>

  <div class="card">
    <div class="card-title" id="msTitle">
      MAÇ SONU AÇILIŞ ORANLARI
    </div>
    <div class="grid3">
      <div class="field">
        <label>MS 1</label>
        <div class="pair">
          <select class="op" id="op_ms1"></select>
          <input class="val" id="v_ms1" placeholder="1.75">
        </div>
      </div>
      <div class="field">
        <label>MS X</label>
        <div class="pair">
          <select class="op" id="op_ms0"></select>
          <input class="val" id="v_ms0" placeholder="3.40">
        </div>
      </div>
      <div class="field">
        <label>MS 2</label>
        <div class="pair">
          <select class="op" id="op_ms2"></select>
          <input class="val" id="v_ms2" placeholder="4.20">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">MS ASYA HANDİKAP ORANLARI</div>
    <div class="grid2">
      <div class="field">
        <label>Ev Sahibi Handikap</label>
        <div class="pair">
          <select class="op" id="op_ah_ev"></select>
          <input class="val" id="v_ah_ev" placeholder="0.85">
        </div>
      </div>
      <div class="field">
        <label>Deplasman Handikap</label>
        <div class="pair">
          <select class="op" id="op_ah_dep"></select>
          <input class="val" id="v_ah_dep" placeholder="0.95">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">MS GOL BAHİSLERİ</div>
    <div class="grid2">
      <div class="field">
        <label>2.5 Üst</label>
        <div class="pair">
          <select class="op" id="op_ust"></select>
          <input class="val" id="v_ust" placeholder="1.65">
        </div>
      </div>
      <div class="field">
        <label>2.5 Alt</label>
        <div class="pair">
          <select class="op" id="op_alt"></select>
          <input class="val" id="v_alt" placeholder="1.95">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="sbForm" style="display:none">
  <div class="card">
    <div class="card-title">SBOBET SKOR ORANLARI</div>
    <div class="field" style="margin-bottom:10px">
      <label>Aranacak Skor</label>
      <select class="val" id="sb_score_select">
        <optgroup label="Ev Sahibi">
          <option value="1:0">1-0</option>
          <option value="2:0">2-0</option>
          <option value="2:1" selected>2-1</option>
          <option value="3:0">3-0</option>
          <option value="3:1">3-1</option>
          <option value="3:2">3-2</option>
          <option value="4:0">4-0</option>
          <option value="4:1">4-1</option>
          <option value="4:2">4-2</option>
        </optgroup>
        <optgroup label="Beraberlik">
          <option value="0:0">0-0</option>
          <option value="1:1">1-1</option>
          <option value="2:2">2-2</option>
          <option value="3:3">3-3</option>
        </optgroup>
        <optgroup label="Deplasman">
          <option value="0:1">0-1</option>
          <option value="0:2">0-2</option>
          <option value="1:2">1-2</option>
          <option value="0:3">0-3</option>
          <option value="1:3">1-3</option>
          <option value="2:3">2-3</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label>Skor Oranı</label>
      <div class="pair">
        <select class="op" id="op_sb_odd"></select>
        <input class="val" id="v_sb_odd"
          placeholder="8.50 veya 7.0-9.0">
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">
    GERÇEKLEŞEN MAÇ SKORU (OPSİYONEL)
  </div>
  <input class="val" id="final_score"
    placeholder="Örn: 2-1">
</div>

<button class="submit" id="submitBtn"
  onclick="sendToBotDirect()">
  📊 Eşleşen Maçları Getir
</button>

<div id="status" role="status" aria-live="polite"></div>

<div class="footer">
  GoalSignals.com.tr
</div>

<script>
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbw03UqjJX2ITNlXnor5Z2re1F037O9-ddfaebeELLm-n540SF5b4nLxPsr0hi6yCnSqng/exec";

const tg = window.Telegram?.WebApp || null;

if (tg) {
  tg.ready();
  tg.expand();
}

let bookmaker = "Bet365";
let timing = "open";
let busy = false;

const el = id => document.getElementById(id);
const value = id => el(id)?.value?.trim() || "";

const operators = [
  ["=", "="],
  [">", ">"],
  ["<", "<"],
  [">=", ">="],
  ["<=", "<="],
  ["between", "Ar."]
];

[
  "ms1","ms0","ms2",
  "ah_ev","ah_dep",
  "ust","alt","sb_odd"
].forEach(name => {
  const select = el("op_" + name);

  operators.forEach(([v,label]) => {
    const option = document.createElement("option");
    option.value = v;
    option.textContent = label;
    select.appendChild(option);
  });
});

function setBookmaker(b) {
  bookmaker = b;

  el("tabBet").classList.toggle(
    "active", b === "Bet365"
  );
  el("tabSb").classList.toggle(
    "active", b === "Sbobet"
  );

  el("betForm").style.display =
    b === "Bet365" ? "block" : "none";

  el("sbForm").style.display =
    b === "Sbobet" ? "block" : "none";
}

function setTiming(t) {
  timing = t;

  el("openBtn").classList.toggle(
    "active", t === "open"
  );
  el("closeBtn").classList.toggle(
    "active", t === "close"
  );

  el("msTitle").textContent =
    "MAÇ SONU " +
    (t === "open" ? "AÇILIŞ" : "KAPANIŞ") +
    " ORANLARI";
}

function getChatId() {
  const params = new URLSearchParams(location.search);
  const chatId = params.get("chat_id");

  if (chatId && /^\d+$/.test(chatId)) {
    return chatId;
  }

  const userId = tg?.initDataUnsafe?.user?.id;
  return userId ? String(userId) : null;
}

function collect() {
  return {
    bookmaker:bookmaker,
    timing:timing,

    op_ms1:value("op_ms1"),
    val_ms1:value("v_ms1"),

    op_ms0:value("op_ms0"),
    val_ms0:value("v_ms0"),

    op_ms2:value("op_ms2"),
    val_ms2:value("v_ms2"),

    op_ah_ev:value("op_ah_ev"),
    val_ah_ev:value("v_ah_ev"),

    op_ah_dep:value("op_ah_dep"),
    val_ah_dep:value("v_ah_dep"),

    op_ust:value("op_ust"),
    val_ust:value("v_ust"),

    op_alt:value("op_alt"),
    val_alt:value("v_alt"),

    selected_score:value("sb_score_select"),
    op_sb_odd:value("op_sb_odd"),
    val_sb_odd:value("v_sb_odd"),

    final_score:value("final_score")
  };
}

function validate(p) {
  if (
    p.final_score &&
    !/^\d+\s*[-:]\s*\d+$/.test(p.final_score)
  ) {
    throw new Error("Skor 2-1 şeklinde olmalı.");
  }

  const names = p.bookmaker === "Bet365"
    ? ["ms1","ms0","ms2","ah_ev","ah_dep","ust","alt"]
    : ["sb_odd"];

  for (const name of names) {
    const v = p["val_" + name];
    const op = p["op_" + name];

    if (!v) continue;

    const num = /^[+-]?\d+(?:[.,]\d+)?$/;
    const range =
      /^([+-]?\d+(?:[.,]\d+)?)\s*-\s*([+-]?\d+(?:[.,]\d+)?)$/;

    const match = v.match(range);

    if (op === "between" && !match) {
      throw new Error(
        "Aralık için 1.50-2.00 girin."
      );
    }

    if (!num.test(v) && !match) {
      throw new Error("Geçersiz oran: " + v);
    }

    if (match) {
      const min = Number(match[1].replace(",", "."));
      const max = Number(match[2].replace(",", "."));
      if (min > max) {
        throw new Error("Aralık sırası hatalı.");
      }
    }
  }
}

function status(text, error = false) {
  const node = el("status");
  node.style.display = "block";
  node.style.color = error ? "#ff7777" : "#00c985";
  node.textContent = text;
}

function resetButton() {
  busy = false;
  el("submitBtn").disabled = false;
  el("submitBtn").textContent =
    "📊 Eşleşen Maçları Getir";
}

async function sendToBotDirect() {
  if (busy) return;

  const chatId = getChatId();

  if (!chatId) {
    status(
      "❌ Telegram bilgisi alınamadı. " +
      "Paneli bot üzerinden açın.",
      true
    );
    return;
  }

  const params = collect();

  try {
    validate(params);
  } catch (err) {
    status("❌ " + err.message, true);
    return;
  }

  busy = true;
  el("submitBtn").disabled = true;
  el("submitBtn").textContent = "⏳ Gönderiliyor...";

  status("⏳ Analiz isteği gönderiliyor...");

  try {
    await fetch(SCRIPT_URL, {
      method:"POST",
      mode:"no-cors",
      redirect:"follow",
      headers:{
        "Content-Type":"text/plain;charset=UTF-8"
      },
      body:JSON.stringify({
        action:"direct_filter",
        chat_id:chatId,
        params:params
      })
    });

    status(
      "📨 İstek gönderildi. " +
      "Analiz raporunu Telegram'da kontrol edin."
    );

    el("submitBtn").textContent =
      "📨 İstek Gönderildi";

    setTimeout(resetButton, 5000);

  } catch (err) {
    console.error(err);
    status(
      "❌ Bağlantı hatası. " +
      "Google Apps Script adresini kontrol edin.",
      true
    );
    resetButton();
  }
}
</script>
</body>
</html>
