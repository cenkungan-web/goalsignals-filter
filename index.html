<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoalSignals Analiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e1621;
      --card: #17212b;
      --border: #242f3d;
      --accent: #5288c1;
      --text: #f5f5f5;
      --muted: #7f91a4;
      --btn: #2ea6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 10px; width: 100vw; overflow-x: hidden; }
    
    .brand { text-align: center; padding: 4px 0 10px; font-size: 13px; font-weight: 700; color: #00c985; letter-spacing: 0.5px; }

    .tabs-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab-btn {
      flex: 1; padding: 10px 4px; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 12px; text-align: center; cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: #70b3f5; }

    .timing-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .timing-btn {
      flex: 1; padding: 7px 2px; background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted); font-size: 11px; text-align: center; cursor: pointer;
    }
    .timing-btn.active { background: #233b54; color: #5288c1; border-color: #5288c1; font-weight: bold; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }

    .op-input-group { display: flex; gap: 4px; align-items: center; }
    .op-select {
      background: #1c2733; border: 1px solid var(--border); color: #64b5f6; font-weight: bold;
      padding: 6px 2px; border-radius: 5px; font-size: 12px; outline: none; width: 44px; text-align: center;
    }
    .val-input {
      background: #0e1621; border: 1px solid var(--border); color: #fff;
      padding: 6px 6px; border-radius: 5px; font-size: 12px; outline: none; flex: 1; width: 100%;
    }

    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .input-box { display: flex; flex-direction: column; gap: 2px; }
    .input-box label { font-size: 10px; color: var(--muted); }

    .submit-btn {
      width: 100%; background: var(--btn); color: #fff; border: none; padding: 13px;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px;
      box-shadow: 0 4px 14px rgba(46,166,255,0.3);
    }
    .submit-btn:disabled { background: #444; }
  </style>
</head>
<body>

  <div class="brand">⚡ GOALSIGNALS.COM.TR ANALİZ</div>

  <!-- Büro Seçimi -->
  <div class="tabs-row">
    <div class="tab-btn active" id="tab-b365" onclick="setBookmaker('Bet365')">🟢 Bet365 Oranları</div>
    <div class="tab-btn" id="tab-sbobet" onclick="setBookmaker('Sbobet')">🔵 Sbobet Skor Oranları</div>
  </div>

  <!-- ==================== BET365 FORMU ==================== -->
  <div id="form-bet365">
    <div class="timing-row">
      <div class="timing-btn active" id="time-open" onclick="setTiming('open')">Açılış Oranları</div>
      <div class="timing-btn" id="time-close" onclick="setTiming('close')">Kapanış Oranları</div>
    </div>

    <!-- 1. MS Taraf -->
    <div class="card">
      <div class="card-title" id="title-ms">Maç Sonu (MS) Açılış Oranları</div>
      <div class="grid-3">
        <div class="input-box">
          <label>MS 1</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ms1"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option><option value="between">Ar.</option></select>
            <input type="text" class="val-input" id="v_ms1" placeholder="1.75">
          </div>
        </div>
        <div class="input-box">
          <label>MS X</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ms0"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option><option value="between">Ar.</option></select>
            <input type="text" class="val-input" id="v_ms0" placeholder="3.40">
          </div>
        </div>
        <div class="input-box">
          <label>MS 2</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ms2"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option><option value="between">Ar.</option></select>
            <input type="text" class="val-input" id="v_ms2" placeholder="4.20">
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Asya Handikap -->
    <div class="card">
      <div class="card-title">MS Asya Handikap Oranları</div>
      <div class="grid-2">
        <div class="input-box">
          <label>Ev Sahibi Handikap</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ah_ev"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option></select>
            <input type="text" class="val-input" id="v_ah_ev" placeholder="örn: 0.85">
          </div>
        </div>
        <div class="input-box">
          <label>Deplasman Handikap</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ah_dep"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option></select>
            <input type="text" class="val-input" id="v_ah_dep" placeholder="örn: 0.95">
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Gol Bahisleri -->
    <div class="card">
      <div class="card-title">MS Gol Bahisleri (Alt / Üst)</div>
      <div class="grid-2">
        <div class="input-box">
          <label>2.5 Üst</label>
          <div class="op-input-group">
            <select class="op-select" id="op_ust"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option></select>
            <input type="text" class="val-input" id="v_ust" placeholder="örn: 1.65">
          </div>
        </div>
        <div class="input-box">
          <label>2.5 Alt</label>
          <div class="op-input-group">
            <select class="op-select" id="op_alt"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option></select>
            <input type="text" class="val-input" id="v_alt" placeholder="örn: 1.95">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SBOBET SKOR FORMU ==================== -->
  <div id="form-sbobet" style="display: none;">
    <div class="card">
      <div class="card-title">🎯 Sbobet Skor Oranı Seçimi</div>
      <div class="input-box" style="margin-bottom: 8px;">
        <label>Aranacak Skor</label>
        <select class="val-input" id="sb_score_select" style="padding: 8px;">
          <optgroup label="Ev Sahibi Kazanır">
            <option value="1:0">1 - 0</option><option value="2:0">2 - 0</option><option value="2:1" selected>2 - 1</option>
            <option value="3:0">3 - 0</option><option value="3:1">3 - 1</option><option value="3:2">3 - 2</option>
            <option value="4:0">4 - 0</option><option value="4:1">4 - 1</option><option value="4:2">4 - 2</option>
          </optgroup>
          <optgroup label="Beraberlik">
            <option value="0:0">0 - 0</option><option value="1:1">1 - 1</option><option value="2:2">2 - 2</option><option value="3:3">3 - 3</option>
          </optgroup>
          <optgroup label="Deplasman Kazanır">
            <option value="0:1">0 - 1</option><option value="0:2">0 - 2</option><option value="1:2">1 - 2</option>
            <option value="0:3">0 - 3</option><option value="1:3">1 - 3</option><option value="2:3">2 - 3</option>
          </optgroup>
        </select>
      </div>

      <div class="input-box">
        <label>Skor Oranı ve Koşul</label>
        <div class="op-input-group">
          <select class="op-select" id="op_sb_odd"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option><option value="between">Ar.</option></select>
          <input type="text" class="val-input" id="v_sb_odd" placeholder="örn: 8.50 veya 7.0-9.0">
        </div>
      </div>
    </div>
  </div>

  <!-- ORTAK SKOR FİLTRESİ -->
  <div class="card">
    <div class="card-title">Gerçekleşen Maç Skoru (Opsiyonel)</div>
    <div class="input-box">
      <input type="text" class="val-input" id="final_score" placeholder="örn: 2-1 veya 1-1">
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="sendToBot()">📊 Eşleşen Maçları Getir</button>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentBookmaker = "Bet365";
    let currentTiming = "open";

    function setBookmaker(b) {
      currentBookmaker = b;
      document.getElementById("tab-b365").classList.toggle("active", b === "Bet365");
      document.getElementById("tab-sbobet").classList.toggle("active", b === "Sbobet");
      document.getElementById("form-bet365").style.display = (b === "Bet365") ? "block" : "none";
      document.getElementById("form-sbobet").style.display = (b === "Sbobet") ? "block" : "none";
    }

    function setTiming(t) {
      currentTiming = t;
      document.getElementById("time-open").classList.toggle("active", t === "open");
      document.getElementById("time-close").classList.toggle("active", t === "close");
      document.getElementById("title-ms").innerText = "Maç Sonu (MS) " + (t === "open" ? "Açılış" : "Kapanış") + " Oranları";
    }

    function sendToBot() {
      const payload = {
        bookmaker: currentBookmaker,
        timing: currentTiming,
        op_ms1: document.getElementById("op_ms1").value,
        val_ms1: document.getElementById("v_ms1").value,
        op_ms0: document.getElementById("op_ms0").value,
        val_ms0: document.getElementById("v_ms0").value,
        op_ms2: document.getElementById("op_ms2").value,
        val_ms2: document.getElementById("v_ms2").value,
        op_ah_ev: document.getElementById("op_ah_ev").value,
        val_ah_ev: document.getElementById("v_ah_ev").value,
        op_ah_dep: document.getElementById("op_ah_dep").value,
        val_ah_dep: document.getElementById("v_ah_dep").value,
        op_ust: document.getElementById("op_ust").value,
        val_ust: document.getElementById("v_ust").value,
        op_alt: document.getElementById("op_alt").value,
        val_alt: document.getElementById("v_alt").value,
        selected_score: document.getElementById("sb_score_select").value,
        op_sb_odd: document.getElementById("op_sb_odd").value,
        val_sb_odd: document.getElementById("v_sb_odd").value,
        final_score: document.getElementById("final_score").value
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Lütfen Telegram içinden açın.");
      }
    }
  </script>
</body>
</html>
